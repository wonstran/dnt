[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dnt"
version = "0.3.4"
description = "A Python tool for video-based traffic analytics"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [
  { name = "Zhenyu Wang", email = "wonstran@hotmail.com" },
]
keywords = ["traffic", "vehicle", "trajectory", "safety"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "torch>=2.2",
  "torchvision",
  "ultralytics>=8.4.14,<9",
  "boxmot==16.0.11",
  "numpy>=2.2,<3",
  "pandas>=2.2,<3",
  "opencv-python>=4.7,<5",
  "scipy>=1.13",
  "filterpy",
  "pyyaml",
  "tqdm",
  "requests",
  "Pillow",
  "shapely>=2",
  "geopandas",
  "easyocr",
  "dateparser",
  "pytz",
  "cython_bbox",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "build"]
docs = ["mkdocs-material", "mkdocstrings[python]", "mkdocs-with-pdf", "qrcode"]
refine-dino = ["transformers>=4.40"]
refine-reid = ["torchreid", "tensorboard"]
refine-vlm = ["openai>=1.40", "anthropic>=0.40"]
refine = ["transformers>=4.40", "torchreid", "tensorboard", "openai>=1.40", "anthropic>=0.40"]

[project.scripts]
dnt-refine = "dnt.refine.cli:main"

[project.urls]
Homepage = "https://github.com/wonstran/dnt"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dnt = [
  "shared/data/*.names",
  "track/reid_weights/osnet_x1_0_msmt17.pt",
  "detect/signal/weights/ped_signal.pt",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "D"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "E501"]
"tools/**" = ["D", "E501"]
# Legacy lint baseline (dnt 0.3.3): exactly the rule codes these pre-existing modules violated
# when CI adopted `ruff check src tests tools`. Every other rule is enforced for them. Shrink this
# list as modules are cleaned up (sub-project B); never add codes to hide new violations.
"src/dnt/detect/signal/detector.py" = ["D100", "D102", "E501", "RUF013"]
"src/dnt/detect/yolo/detector.py" = ["E501"]
"src/dnt/detect/yolo/segmentor.py" = ["E501"]
"src/dnt/engine/bbox_interp.py" = ["E501"]
"src/dnt/engine/bbox_iou.py" = ["E501"]
"src/dnt/filter/filter.py" = ["B905", "E501", "E722"]
"src/dnt/label/labeler.py" = ["E501"]
"src/dnt/shared/__init__.py" = ["D104"]
"src/dnt/shared/download.py" = ["D100", "D103", "I001"]
"src/dnt/shared/files.py" = ["E501"]
"src/dnt/shared/filter.py" = ["B006", "B905", "D100", "D103", "E501", "I001"]
"src/dnt/shared/synhcro.py" = [
  "D100", "D200", "D205", "D212", "D410", "D411", "D413", "E501", "RUF002", "UP006", "UP035", "UP045",
]
"src/dnt/track/re_class.py" = ["E501"]

[tool.ruff.format]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not model and not golden and not slow'"
markers = [
  "model: downloads real model weights (opt-in)",
  "golden: needs DNT_REF_CLIP and DNT_GOLDEN_DIR (opt-in)",
  "slow: builds and installs the wheel (CI wheel job)",
]
filterwarnings = [
  "error::FutureWarning:dnt.*",
  # asserted explicitly in tests/test_tracker_known_issue.py; silenced elsewhere to keep output clean
  "ignore:Known issue \\(dnt 0.3.3\\):UserWarning",
]
