[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dnt"
version = "0.3.3"
description = "A Python tool for video-based traffic analytics"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [
  { name = "Zhenyu Wang", email = "wonstran@hotmail.com" },
]
keywords = ["traffic", "vehicle", "trajectory", "safety"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "torch>=2.2",
  "torchvision",
  "ultralytics>=8.4.14,<9",
  "boxmot==16.0.11",
  "numpy>=2.2,<3",
  "pandas>=2.2,<3",
  "opencv-python>=4.7,<5",
  "scipy>=1.13",
  "filterpy",
  "pyyaml",
  "tqdm",
  "requests",
  "Pillow",
  "shapely>=2",
  "geopandas",
  "easyocr",
  "dateparser",
  "pytz",
  "cython_bbox",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "build"]
docs = ["mkdocs-material", "mkdocstrings[python]", "mkdocs-with-pdf"]

[project.urls]
Homepage = "https://github.com/wonstran/dnt"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dnt = [
  "shared/data/*.names",
  "track/reid_weights/osnet_x1_0_msmt17.pt",
  "detect/signal/weights/ped_signal.pt",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "D"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "E501"]
"tools/**" = ["D", "E501"]

[tool.ruff.format]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not model and not golden and not slow'"
markers = [
  "model: downloads real model weights (opt-in)",
  "golden: needs DNT_REF_CLIP and DNT_GOLDEN_DIR (opt-in)",
  "slow: builds and installs the wheel (CI wheel job)",
]
filterwarnings = ["error::FutureWarning:dnt.*"]
