name: CI
on:
  push:
    branches: [main, "release/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]" --extra-index-url https://download.pytorch.org/whl/cpu
      - run: python -m ruff check tests tools src/dnt/_device.py src/dnt/track/_boxmot_compat.py
      - run: python -m ruff check src --select E9,F63,F7,F82,F401
      - run: python -m pytest -m "not model and not golden and not slow"

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]" --extra-index-url https://download.pytorch.org/whl/cpu
      - run: python -m pytest -m slow tests/test_wheel.py -v
